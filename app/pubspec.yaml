name: kenoma
description: "Kenoma: Veilbreakers, RPG mobile de exploração via GPS."
publish_to: 'none'
version: 0.26.0+53

environment:
  sdk: ^3.13.4

dependencies:
  device_info_plus: ^13.2.0
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.2
  geolocator: ^14.1.1
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  timezone: ^0.11.2
  vibration: ^3.2.1
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/art/map/
    - assets/art/ui/
    - assets/art/ui/icons/
    - assets/art/ui/apps/
    - assets/art/ui/moon/
    - assets/art/ui/climate/
    - assets/art/ui/event/
    - assets/art/ui/types/
    - assets/art/traffic/
    - assets/art/sparks/
    - assets/art/creatures/
    - assets/art/creatures/bitling/
    - assets/art/creatures/bouldkin/
    - assets/art/creatures/brookkin/
    - assets/art/creatures/cinderkin/
    - assets/art/creatures/coilkin/
    - assets/art/creatures/fairkin/
    - assets/art/creatures/frond_arquetipo/
    - assets/art/creatures/frond_entidade/
    - assets/art/creatures/frondling/
    - assets/art/creatures/glimlet/
    - assets/art/creatures/glitchkin/
    - assets/art/creatures/gratekin/
    - assets/art/creatures/hollowkin/
    - assets/art/creatures/hum_arquetipo/
    - assets/art/creatures/hum_entidade/
    - assets/art/creatures/humoth/
    - assets/art/creatures/kilnshade/
    - assets/art/creatures/pebblet/
    - assets/art/creatures/prismkin/
    - assets/art/creatures/rillet/
    - assets/art/creatures/rootseer/
    - assets/art/creatures/rustling/
    - assets/art/creatures/shade_arquetipo/
    - assets/art/creatures/shade_entidade/
    - assets/art/creatures/shadekin/
    - assets/art/creatures/soot_arquetipo/
    - assets/art/creatures/soot_entidade/
    - assets/art/creatures/sootling/
    - assets/art/creatures/sprigglet/
    - assets/art/creatures/thicketkin/
    - assets/art/creatures/umbrel/
    - assets/art/creatures/wellmirror/
    - assets/art/creatures/wisp_arquetipo/
    - assets/art/creatures/wisp_entidade/
    - assets/art/creatures/wisplet/
    - assets/art/creatures/wyrmkin/
    - assets/art/creatures/wyrmlet/
    - assets/lab/
    - assets/regions/
    - assets/fonts/OFL-Silkscreen.txt
    - assets/fonts/OFL-PixelifySans.txt

  fonts:
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
    - family: Pixelify Sans
      fonts:
        - asset: assets/fonts/PixelifySans.ttf
