name: kenoma
description: "Kenoma: Veilbreakers, RPG mobile de exploração via GPS."
publish_to: 'none'
version: 0.12.1+19

environment:
  sdk: ^3.13.4

dependencies:
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  geolocator: ^14.1.1
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  vibration: ^3.2.1
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/regions/
    - assets/fonts/OFL-Silkscreen.txt

  fonts:
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
