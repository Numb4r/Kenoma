name: kenoma
description: "Kenoma: Veilbreakers, RPG mobile de exploração via GPS."
publish_to: 'none'
version: 0.6.1+8

environment:
  sdk: ^3.13.4

dependencies:
  crypto: ^3.0.7
  flame: ^1.38.2
  flutter:
    sdk: flutter
  geolocator: ^14.1.1
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/regions/
    - assets/fonts/OFL-Silkscreen.txt

  fonts:
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
